<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>مجمع أم القرى الطبي ومصنع التأهيل 2026 - جاري التحويل</title>
    <script type="text/javascript">
      // GitHub Pages Single Page App Redirect script
      // Redirects 404 paths back to the SPA index while preserving route and query
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; background-color: #FAF8F1; color: #075563;">
    <h2>مجمع أم القرى الطبي - بركاء، سلطنة عمان</h2>
    <p>جاري تحويل المسار إلى النظام المتكامل...</p>
  </body>
</html>
